name: Deploy MMD Cloud v6.8.1

on:
  push:
    paths:
      - 'deploy-v6.8.1.payload'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Release-Paket entpacken
        shell: bash
        run: |
          base64 -d deploy-v6.8.1.payload > /tmp/mmd-v6.8.1.tar.gz
          mkdir -p /tmp/mmd-v6.8.1
          tar -xzf /tmp/mmd-v6.8.1.tar.gz -C /tmp/mmd-v6.8.1
          cp /tmp/mmd-v6.8.1/index.html ./index.html
          cp /tmp/mmd-v6.8.1/app.js ./app.js
          cp /tmp/mmd-v6.8.1/style.css ./style.css
          cp /tmp/mmd-v6.8.1/database.rules.final.json ./database.rules.final.json
          cp /tmp/mmd-v6.8.1/PROJECT_STATUS.md ./PROJECT_STATUS_v6.8.1.md

      - name: v6.8.1 committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js style.css database.rules.final.json PROJECT_STATUS_v6.8.1.md
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
            exit 0
          fi
          git commit -m "Release MMD Cloud v6.8.1"
          git push
